<!doctype html>
<!--
  DriveVault - Connected App Data Extractor

  Run:
    Open this file through any static web server, for example:
      python3 -m http.server 5173
    Then visit http://localhost:5173

  Google OAuth setup:
    1. Go to https://console.cloud.google.com
    2. Create a project, then enable "Google Drive API" and "Drive Activity API".
    3. Configure OAuth consent and add these scopes:
       - https://www.googleapis.com/auth/drive.appdata
       - https://www.googleapis.com/auth/drive.metadata.readonly
       - https://www.googleapis.com/auth/drive.readonly
       - https://www.googleapis.com/auth/drive.activity.readonly
       - https://www.googleapis.com/auth/userinfo.profile
       - https://www.googleapis.com/auth/userinfo.email
    4. Credentials -> Create OAuth 2.0 Client ID -> Web Application.
    5. Add your domain, for example http://localhost:5173, to Authorized JavaScript origins.
    6. Replace YOUR_GOOGLE_CLIENT_ID below with that OAuth client ID, or configure it dynamically in the UI.

  Important Google Drive limitation:
    appDataFolder is isolated per OAuth application. DriveVault can audit files apps saved
    into your normal Drive, app-permission signals available through token metadata and
    Drive Activity, and DriveVault's own appDataFolder. Google does not allow any app to
    read another app's private appDataFolder.

  Optional Claude analysis:
    Browsers should not call Anthropic directly with a secret API key. Set
    window.DRIVEVAULT_CONFIG.anthropicProxyUrl to your own authenticated proxy endpoint
    that accepts { system, prompt, model, stream } and returns text/event-stream.
-->

      function cx(...items) {
        return items.filter(Boolean).join(" ");
      }

      function formatBytes(value) {
        const bytes = Number(value || 0);
        if (!bytes) return "0 B";
        const units = ["B", "KB", "MB", "GB", "TB"];
        const i = Math.min(Math.floor(Math.log(bytes) / Math.log(1024)), units.length - 1);
        return `${(bytes / Math.pow(1024, i)).toFixed(i ? 1 : 0)} ${units[i]}`;
      }

      function formatDate(value) {
        if (!value) return "Unknown";
        return new Intl.DateTimeFormat(undefined, {
          dateStyle: "medium",
          timeStyle: "short",
        }).format(new Date(value));
      }

      function safeName(name) {
        return (name || "drivevault-file").replace(/[\\/:*?"<>|]+/g, "_");
      }

      function iconForMime(mime = "", name = "") {
        const lower = `${mime} ${name}`.toLowerCase();
        if (lower.includes("json")) return { label: "JSON", color: "bg-sky-400/10 text-sky-400 border-sky-400/20" };
        if (lower.startsWith("text/") || /\.(txt|md|csv|log|xml|yaml|yml)$/i.test(name)) return { label: "TXT", color: "bg-emerald-400/10 text-emerald-400 border-emerald-400/20" };
        if (lower.startsWith("image/")) return { label: "IMG", color: "bg-fuchsia-400/10 text-fuchsia-400 border-fuchsia-400/20" };
        if (lower.includes("octet") || lower.includes("binary")) return { label: "BIN", color: "bg-amber-400/10 text-amber-400 border-amber-400/20" };
        return { label: "FILE", color: "bg-slate-400/10 text-slate-400 border-slate-400/20" };
      }

      function inferAppName(file) {
        if (file.source === "appDataFolder") return "DriveVault AppDataFolder";
        const props = file.appProperties || {};
        const modifierEmail = file.lastModifyingUser?.emailAddress || file.sharingUser?.emailAddress || file.owners?.[0]?.emailAddress;
        const candidates = [
          props.app,
          props.appName,
          props.application,
          props.package,
          props.bundle,
          props.client,
          file.description,
          modifierEmail && !modifierEmail.endsWith("@gmail.com") ? modifierEmail : "",
          modifierEmail ? modifierEmail.split("@")[1] : "",
        ].filter(Boolean);
        if (candidates.length) return String(candidates[0]).slice(0, 60);
        const cleaned = (file.name || "Unknown App Data")
          .replace(/\.(json|txt|bin|db|sqlite|xml|bak|dat|cfg|config|log)$/i, "")
          .replace(/[_-]?(settings|config|backup|state|sync|data|prefs|preferences)$/i, "")
          .replace(/[_-]+/g, " ")
          .trim();
        return cleaned || "Unattributed App Data";
      }

      function groupFiles(files) {
        const map = new Map();
        files.forEach((file) => {
          const appName = inferAppName(file);
          if (!map.has(appName)) {
            map.set(appName, {
              name: appName,
              files: [],
              size: 0,
              lastModified: "",
              riskSignals: new Set(),
              source: file.source || "drive",
            });
          }
          const group = map.get(appName);
          group.files.push(file);
          group.size += Number(file.size || 0);
          if (!group.lastModified || new Date(file.modifiedTime) > new Date(group.lastModified)) {
            group.lastModified = file.modifiedTime;
          }
          scanMetadata(file).forEach((signal) => group.riskSignals.add(signal));
        });
        return Array.from(map.values()).map((group) => ({
          ...group,
          riskSignals: Array.from(group.riskSignals),
          risk: scoreRisk(group),
        }));
      }

      function deriveConnectedApps(files, appDataFiles, tokenInfo, activities) {
        const groups = groupFiles(files.filter((file) => file.source !== "appDataFolder"));
        const scopes = String(tokenInfo?.scope || "").split(/\s+/).filter(Boolean);
        const currentApp = {
          name: "DriveVault OAuth Client",
          files: appDataFiles,
          size: appDataFiles.reduce((sum, file) => sum + Number(file.size || 0), 0),
          lastModified: appDataFiles.map((file) => file.modifiedTime).sort().at(-1),
          permission: scopes.includes("https://www.googleapis.com/auth/drive.appdata") ? "Appdata-only + granted audit scopes" : "Current OAuth token",
          risk: scopes.some((scope) => scope.includes("drive.readonly")) ? "Medium" : "Low",
          riskSignals: [],
          isCurrentClient: true,
        };
        const activityHints = new Map();
        activities.forEach((activity) => {
          const time = activity.timestamp || activity.timeRange?.endTime || activity.timeRange?.startTime;
          const actors = activity.actors || [];
          actors.forEach((actor) => {
            const key = actor.user?.knownUser?.personName || actor.user?.deletedUser?.type || actor.systemEvent?.type || actor.administrator?.type || "Automated Drive actor";
            activityHints.set(key, time || new Date().toISOString());
          });
        });
        return [
          currentApp,
          ...groups.map((group) => ({
            ...group,
            permission: group.files.some((file) => file.capabilities?.canEdit || file.capabilities?.canDelete) ? "Read-write signals" : "Read-only visible files",
            activityHintCount: activityHints.size,
          })),
        ];
      }

      function scanMetadata(file) {
        const text = JSON.stringify(file).toLowerCase();
        return SENSITIVE_KEYS.filter((key) => text.includes(key.toLowerCase()));
      }

      function scanContent(text = "") {
        const lower = text.toLowerCase();
        return SENSITIVE_KEYS.filter((key) => lower.includes(key.toLowerCase()));
      }

      function scoreRisk(group) {
        let score = 0;
        if (group.size > 10 * 1024 * 1024) score += 2;
        else if (group.size > 1024 * 1024) score += 1;
        if (group.files.length > 20) score += 1;
        if (group.riskSignals?.length) score += Math.min(3, group.riskSignals.length);
        const newest = group.lastModified ? Date.now() - new Date(group.lastModified).getTime() : Infinity;
        if (newest < 1000 * 60 * 60 * 24 * 7) score += 1;
        if (score >= 4) return "High";
        if (score >= 2) return "Medium";
        return "Low";
      }

      async function fetchWithBackoff(url, options = {}, retries = 4) {
        for (let attempt = 0; attempt <= retries; attempt += 1) {
          const res = await fetch(url, options);
          if (![429, 503].includes(res.status)) return res;
          if (attempt === retries) return res;
          await new Promise((resolve) => setTimeout(resolve, Math.pow(2, attempt) * 700 + Math.random() * 250));
        }
      }

      function createLimiter(max = 5) {
        let active = 0;
        const queue = [];
        const next = () => {
          if (active >= max || !queue.length) return;
          active += 1;
          const { task, resolve, reject } = queue.shift();
          task().then(resolve, reject).finally(() => {
            active -= 1;
            next();
          });
        };
        return (task) =>
          new Promise((resolve, reject) => {
            queue.push({ task, resolve, reject });
            next();
          });
      }

      async function listAllAppData(token, onProgress) {
        let pageToken = null;
        const files = [];
        do {
          const params = new URLSearchParams({
            spaces: "appDataFolder",
            fields: APPDATA_FIELDS,
            pageSize: "100",
            includeItemsFromAllDrives: "false",
            supportsAllDrives: "false",
          });
          if (pageToken) params.set("pageToken", pageToken);
          const res = await fetchWithBackoff(`https://www.googleapis.com/drive/v3/files?${params}`, {
            headers: { Authorization: `Bearer ${token}` },
          });
          if (res.status === 401) throw new Error("TOKEN_EXPIRED");
          if (!res.ok) throw new Error(await res.text());
          const json = await res.json();
          files.push(...(json.files || []).map((file) => ({ ...file, source: "appDataFolder" })));
          pageToken = json.nextPageToken || null;
          onProgress?.(files.length);
        } while (pageToken);
        return files;
      }

      async function listAllDriveFiles(token, onProgress) {
        let pageToken = null;
        const files = [];
        do {
          const params = new URLSearchParams({
            spaces: "drive",
            fields: DRIVE_FIELDS,
            pageSize: "100",
            includeItemsFromAllDrives: "true",
            supportsAllDrives: "true",
          });
          if (pageToken) params.set("pageToken", pageToken);
          const res = await fetchWithBackoff(`https://www.googleapis.com/drive/v3/files?${params}`, {
            headers: { Authorization: `Bearer ${token}` },
          });
          if (res.status === 401) throw new Error("TOKEN_EXPIRED");
          if (!res.ok) throw new Error(await res.text());
          const json = await res.json();
          files.push(...(json.files || []).filter((file) => !file.trashed).map((file) => ({ ...file, source: "drive" })));
          pageToken = json.nextPageToken || null;
          onProgress?.(files.length);
        } while (pageToken);
        return files;
      }

      async function getTokenInfo(token) {
        const res = await fetchWithBackoff(`https://oauth2.googleapis.com/tokeninfo?access_token=${encodeURIComponent(token)}`);
        if (!res.ok) throw new Error("Unable to introspect OAuth token");
        return res.json();
      }

      async function queryDriveActivity(token) {
        const res = await fetchWithBackoff("https://driveactivity.googleapis.com/v2/activity:query", {
          method: "POST",
          headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
          body: JSON.stringify({ ancestor: { name: "items/root" }, pageSize: 100 }),
        });
        if (!res.ok) return [];
        const json = await res.json();
        return json.activities || [];
      }

      async function createAppDataTestFile(token) {
        const boundary = "drivevault_" + Math.random().toString(16).slice(2);
        const metadata = {
          name: `drivevault-test-${new Date().toISOString().replace(/[:.]/g, "-")}.json`,
          parents: ["appDataFolder"],
          appProperties: { app: "DriveVault", purpose: "appDataFolder capability demonstration" },
        };
        const content = JSON.stringify({ createdBy: "DriveVault", createdAt: new Date().toISOString(), note: "This file lives in DriveVault's own appDataFolder only." }, null, 2);
        const body =
          `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n` +
          `--${boundary}\r\nContent-Type: application/json\r\n\r\n${content}\r\n--${boundary}--`;
        const res = await fetchWithBackoff("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart", {
          method: "POST",
          headers: { Authorization: `Bearer ${token}`, "Content-Type": `multipart/related; boundary=${boundary}` },
          body,
        });
        if (!res.ok) throw new Error(await res.text());
        return res.json();
      }

      async function getProfile(token) {
        const res = await fetchWithBackoff("https://www.googleapis.com/oauth2/v3/userinfo", {
          headers: { Authorization: `Bearer ${token}` },
        });
        if (!res.ok) throw new Error("Unable to fetch Google profile");
        return res.json();
      }

      async function downloadBlob(token, fileId) {
        const res = await fetchWithBackoff(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`, {
          headers: { Authorization: `Bearer ${token}` },
        });
        if (res.status === 401) throw new Error("TOKEN_EXPIRED");
        if (!res.ok) throw new Error(await res.text());
        return res.blob();
      }

      async function deleteDriveFile(token, fileId) {
        const res = await fetchWithBackoff(`https://www.googleapis.com/drive/v3/files/${fileId}`, {
          method: "DELETE",
          headers: { Authorization: `Bearer ${token}` },
        });
        if (!res.ok) throw new Error(await res.text());
      }

      async function blobToBase64(blob) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(String(reader.result).split(",")[1] || "");
          reader.onerror = reject;
          reader.readAsDataURL(blob);
        });
      }

      function reducer(state, action) {
        switch (action.type) {
          case "AUTH":
            return { ...state, token: action.token, profile: action.profile };
          case "LOGOUT":
            return { ...initialState, privacySeen: state.privacySeen };
          case "LOADING":
            return { ...state, loading: action.value, error: "" };
          case "ERROR":
            return { ...state, loading: false, error: action.error };
          case "FILES":
            const combinedFiles = [...action.driveFiles, ...action.appDataFiles];
            // Fix selection reset on background watcher poll updates
            const prevSelectedExists = combinedFiles.some(f => f.id === state.selectedFileId);
            return {
              ...state,
              driveFiles: action.driveFiles,
              appDataFiles: action.appDataFiles,
              files: combinedFiles,
              groups: groupFiles(combinedFiles),
              connectedApps: deriveConnectedApps(combinedFiles, action.appDataFiles, action.tokenInfo, action.activities),
              tokenInfo: action.tokenInfo,
              activities: action.activities,
              selectedFileId: prevSelectedExists ? state.selectedFileId : (combinedFiles[0]?.id || ""),
              loading: false,
              error: "",
            };
          case "SELECT_FILE":
            return { ...state, selectedFileId: action.id, activeTab: "metadata" };
          case "TAB":
            return { ...state, activeTab: action.tab };
          case "TOGGLE":
            const selected = new Set(state.selectedIds);
            selected.has(action.id) ? selected.delete(action.id) : selected.add(action.id);
            return { ...state, selectedIds: selected };
          case "SELECT_ALL":
            return { ...state, selectedIds: action.checked ? new Set(action.ids || state.files.map((file) => file.id)) : new Set() };
          case "CONTENT":
            return { ...state, contentCache: { ...state.contentCache, [action.id]: action.content } };
          case "PROGRESS":
            return { ...state, progress: action.progress };
          case "NOTICE":
            return { ...state, notice: action.notice };
          case "PRIVACY_SEEN":
            return { ...state, privacySeen: true };
          case "PRIMARY_TAB":
            return { ...state, primaryTab: action.tab };
          case "PRIVACY_MODE":
            return { ...state, privacyMode: action.value };
          case "CHANGES":
            return { ...state, changes: action.changes, changedCount: action.changedCount };
          default:
            return state;
        }
      }

      const initialState = {
        token: "",
        profile: null,
        driveFiles: [],
        appDataFiles: [],
        files: [],
        groups: [],
        connectedApps: [],
        tokenInfo: null,
        activities: [],
        selectedFileId: "",
        selectedIds: new Set(),
        contentCache: {},
        primaryTab: "apps",
        activeTab: "metadata",
        loading: false,
        error: "",
        notice: "",
        progress: null,
        privacySeen: false,
        privacyMode: false,
        changes: [],
        changedCount: 0,
      };

      function App() {
        const [state, dispatch] = useReducer(reducer, initialState);
        const [appQuery, setAppQuery] = useState("");
        const [sortBy, setSortBy] = useState("modified");
        const [selectedApp, setSelectedApp] = useState("");
        const [listProgress, setListProgress] = useState(0);
        const [showSettings, setShowSettings] = useState(false);
        
        // Reactive local storage settings
        const [clientId, setClientId] = useState(() => {
          return localStorage.getItem("drivevault_client_id") || window.DRIVEVAULT_CONFIG.googleClientId;
        });
        const [proxyUrl, setProxyUrl] = useState(() => {
          return localStorage.getItem("drivevault_proxy_url") || window.DRIVEVAULT_CONFIG.anthropicProxyUrl;
        });

        const tokenClient = useRef(null);
        const selectedFile = state.files.find((file) => file.id === state.selectedFileId);
        const selectedFiles = state.files.filter((file) => state.selectedIds.has(file.id));

        // Re-initialize GSI token client if clientId changes
        useEffect(() => {
          let timer = null;
          const init = () => {
            if (window.google?.accounts?.oauth2 && clientId && clientId !== "YOUR_GOOGLE_CLIENT_ID") {
              tokenClient.current = window.google.accounts.oauth2.initTokenClient({
                client_id: clientId,
                scope: SCOPES,
                prompt: "consent",
                callback: async (response) => {
                  if (response.error) {
                    dispatch({ type: "ERROR", error: response.error });
                    return;
                  }
                  try {
                    const profile = await getProfile(response.access_token);
                    dispatch({ type: "AUTH", token: response.access_token, profile });
                    await refreshFiles(response.access_token);
                  } catch (error) {
                    dispatch({ type: "ERROR", error: error.message });
                  }
                },
              });
              if (timer) clearInterval(timer);
            }
          };

          if (window.google?.accounts?.oauth2) {
            init();
          } else {
            timer = setInterval(init, 250);
          }
          return () => {
            if (timer) clearInterval(timer);
          };
        }, [clientId]);

        useEffect(() => {
          if (!state.token) return;
          const timer = setInterval(async () => {
            try {
              const [freshDrive, freshAppData] = await Promise.all([listAllDriveFiles(state.token), listAllAppData(state.token)]);
              const fresh = [...freshDrive, ...freshAppData];
              const known = new Map(state.files.map((file) => [file.id, file.modifiedTime]));
              const changed = fresh.filter((file) => known.get(file.id) && known.get(file.id) !== file.modifiedTime);
              const created = fresh.filter((file) => !known.has(file.id));
              if (created.length || changed.length) {
                dispatch({
                  type: "CHANGES",
                  changedCount: created.length + changed.length,
                  changes: [
                    ...created.map((file) => ({ type: "created", file, at: new Date().toISOString() })),
                    ...changed.map((file) => ({ type: "modified", file, at: new Date().toISOString() })),
                    ...state.changes,
                  ].slice(0, 30),
                });
                dispatch({
                  type: "FILES",
                  driveFiles: freshDrive,
                  appDataFiles: freshAppData,
                  tokenInfo: state.tokenInfo,
                  activities: state.activities,
                });
              }
            } catch (error) {
              console.warn("Watcher poll failed", error);
            }
          }, 30000);
          return () => clearInterval(timer);
        }, [state.token, state.files]);

        async function refreshFiles(token = state.token) {
          dispatch({ type: "LOADING", value: true });
          setListProgress(0);
          try {
            const [profileTokenInfo, driveFiles, appDataFiles, activities] = await Promise.all([
              getTokenInfo(token),
              listAllDriveFiles(token, setListProgress),
              listAllAppData(token),
              queryDriveActivity(token),
            ]);
            dispatch({ type: "FILES", driveFiles, appDataFiles, tokenInfo: profileTokenInfo, activities });
          } catch (error) {
            dispatch({
              type: "ERROR",
              error: error.message === "TOKEN_EXPIRED" ? "Google token expired. Please reconnect your account." : error.message,
            });
          }
        }

        const filteredGroups = useMemo(() => {
          const filtered = state.groups.filter((group) => group.name.toLowerCase().includes(appQuery.toLowerCase()));
          return filtered.sort((a, b) => {
            if (sortBy === "name") return a.name.localeCompare(b.name);
            if (sortBy === "count") return b.files.length - a.files.length;
            if (sortBy === "size") return b.size - a.size;
            return new Date(b.lastModified || 0) - new Date(a.lastModified || 0);
          });
        }, [state.groups, appQuery, sortBy]);

        const visibleFiles = selectedApp
          ? state.groups.find((group) => group.name === selectedApp)?.files || []
          : state.primaryTab === "appdata"
            ? state.appDataFiles
            : state.files;

        const handleSaveSettings = (newClientId, newProxyUrl) => {
          localStorage.setItem("drivevault_client_id", newClientId);
          localStorage.setItem("drivevault_proxy_url", newProxyUrl);
          setClientId(newClientId);
          setProxyUrl(newProxyUrl);
          dispatch({ type: "NOTICE", notice: "Configuration saved successfully. System updated." });
        };

        if (!state.token) {
          return (
            <div className="relative min-h-screen">
              <Landing
                onConnect={() => tokenClient.current?.requestAccessToken({ prompt: "consent" })}
                oauthReady={Boolean(tokenClient.current)}
                clientConfigured={clientId && clientId !== "YOUR_GOOGLE_CLIENT_ID"}
                privacySeen={state.privacySeen}
                onPrivacySeen={() => dispatch({ type: "PRIVACY_SEEN" })}
                clientId={clientId}
                proxyUrl={proxyUrl}
                onSaveSettings={handleSaveSettings}
                onOpenSettings={() => setShowSettings(true)}
              />
              <SettingsModal
                isOpen={showSettings}
                onClose={() => setShowSettings(false)}
                clientId={clientId}
                proxyUrl={proxyUrl}
                onSave={handleSaveSettings}
              />
              {state.notice && <Toast tone="notice" message={state.notice} onClose={() => dispatch({ type: "NOTICE", notice: "" })} />}
            </div>
          );
        }

        return (
          <div className="min-h-screen grid-bg">
            <Topbar
              profile={state.profile}
              fileCount={state.files.length}
              size={state.files.reduce((sum, file) => sum + Number(file.size || 0), 0)}
              changedCount={state.changedCount}
              privacyMode={state.privacyMode}
              onPrivacyMode={(value) => dispatch({ type: "PRIVACY_MODE", value })}
              onRefresh={() => refreshFiles()}
              onDisconnect={() => dispatch({ type: "LOGOUT" })}
              onOpenSettings={() => setShowSettings(true)}
            />
            
            {state.error && <Toast tone="error" message={state.error} onClose={() => dispatch({ type: "ERROR", error: "" })} />}
            {state.notice && <Toast tone="notice" message={state.notice} onClose={() => dispatch({ type: "NOTICE", notice: "" })} />}
            
            <main className="mx-auto max-w-[1800px] p-4 lg:p-6 space-y-6">
              <PrimaryTabs active={state.primaryTab} onTab={(tab) => dispatch({ type: "PRIMARY_TAB", tab })} />
              
              {state.primaryTab === "apps" && (
                <ConnectedApps
                  apps={state.connectedApps}
                  files={state.files}
                  tokenInfo={state.tokenInfo}
                  loading={state.loading}
                  listProgress={listProgress}
                  onViewFiles={(appName) => {
                    if (appName === "DriveVault OAuth Client") {
                      setSelectedApp("DriveVault AppDataFolder");
                      dispatch({ type: "PRIMARY_TAB", tab: "appdata" });
                    } else {
                      setSelectedApp(appName);
                      dispatch({ type: "PRIMARY_TAB", tab: "explorer" });
                    }
                  }}
                />
              )}
              
              {state.primaryTab === "analytics" && (
                <Analytics files={state.files} groups={state.connectedApps} changes={state.changes} />
              )}
              
              {(state.primaryTab === "explorer" || state.primaryTab === "appdata") && (
                <div className="grid gap-6 lg:grid-cols-[360px_1fr]">
                  <Sidebar
                    groups={filteredGroups}
                    allGroups={state.groups}
                    query={appQuery}
                    sortBy={sortBy}
                    selectedApp={selectedApp}
                    setQuery={setAppQuery}
                    setSortBy={setSortBy}
                    setSelectedApp={setSelectedApp}
                    loading={state.loading}
                    listProgress={listProgress}
                  />
                  <section className="min-w-0 space-y-6">
                    {state.primaryTab === "appdata" && (
                      <AppDataNotice
                        count={state.appDataFiles.length}
                        onCreate={async () => {
                          try {
                            await createAppDataTestFile(state.token);
                            dispatch({ type: "NOTICE", notice: "Created a test file in DriveVault's own appDataFolder." });
                            await refreshFiles();
                          } catch (error) {
                            dispatch({ type: "ERROR", error: error.message });
                          }
                        }}
                      />
                    )}
                    <BulkToolbar
                      files={state.primaryTab === "appdata" ? state.appDataFiles : state.files}
                      selectedFiles={selectedFiles}
                      selectedCount={state.selectedIds.size}
                      progress={state.progress}
                      onSelectAll={(checked, ids) => dispatch({ type: "SELECT_ALL", checked, ids })}
                      onZip={() => bulkZip(state, dispatch)}
                      onCsv={() => exportCsv(selectedFiles.length ? selectedFiles : visibleFiles)}
                      onReport={() => exportReport(state, dispatch)}
                      onDelete={() => bulkDelete(state, dispatch, refreshFiles)}
                    />
                    <div className="grid gap-6 xl:grid-cols-[minmax(300px,420px)_1fr]">
                      <FileList
                        files={visibleFiles}
                        selectedFileId={state.selectedFileId}
                        selectedIds={state.selectedIds}
                        onSelect={(id) => dispatch({ type: "SELECT_FILE", id })}
                        onToggle={(id) => dispatch({ type: "TOGGLE", id })}
                      />
                      <Inspector
                        state={state}
                        selectedFile={selectedFile}
                        proxyUrl={proxyUrl}
                        onTab={(tab) => dispatch({ type: "TAB", tab })}
                        onContent={(id, content) => dispatch({ type: "CONTENT", id, content })}
                        onNotice={(notice) => dispatch({ type: "NOTICE", notice })}
                      />
                    </div>
                  </section>
                </div>
              )}
              <Footer />
            </main>

            <SettingsModal
              isOpen={showSettings}
              onClose={() => setShowSettings(false)}
              clientId={clientId}
              proxyUrl={proxyUrl}
              onSave={handleSaveSettings}
            />
          </div>
        );
      }

      function SettingsModal({ isOpen, onClose, clientId, proxyUrl, onSave }) {
        const [tempClientId, setTempClientId] = useState(clientId);
        const [tempProxyUrl, setTempProxyUrl] = useState(proxyUrl);

        useEffect(() => {
          setTempClientId(clientId);
          setTempProxyUrl(proxyUrl);
        }, [clientId, proxyUrl, isOpen]);

        if (!isOpen) return null;

        return (
          <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/75 p-4 backdrop-blur-sm animate-fade-in">
            <div className="w-full max-w-lg rounded-3xl border border-vault-line bg-slate-900 p-6 shadow-glow border border-vault-line/40">
              <div className="flex items-center justify-between border-b border-vault-line/30 pb-4">
                <div className="flex items-center gap-2">
                  <Icon name="settings" className="w-5 h-5 text-vault-cyan animate-pulse" />
                  <h3 className="text-xl font-bold text-white font-sans">DriveVault Configuration</h3>
                </div>
                <button onClick={onClose} className="rounded-lg p-1 text-slate-400 hover:bg-white/10 hover:text-white transition">
                  <Icon name="close" className="w-5 h-5" />
                </button>
              </div>

              <div className="mt-4 space-y-4">
                <div>
                  <label className="block font-mono text-[11px] uppercase tracking-wider text-vault-cyan mb-2">Google OAuth Client ID</label>
                  <input
                    type="text"
                    value={tempClientId === "YOUR_GOOGLE_CLIENT_ID" ? "" : tempClientId}
                    onChange={(e) => setTempClientId(e.target.value)}
                    placeholder="Enter Google OAuth Client ID"
                    className="w-full rounded-xl bg-black/30 border border-vault-line/40 px-4 py-3 text-sm text-white focus:border-vault-cyan outline-none transition"
                  />
                  <p className="mt-1.5 text-[11px] text-slate-400 leading-relaxed">
                    Set up a client in the Google Cloud Console. Set Authorized Origins to matching domains (e.g. <code>http://localhost:5173</code>).
                  </p>
                </div>

                <div>
                  <label className="block font-mono text-[11px] uppercase tracking-wider text-vault-cyan mb-2">Anthropic Proxy URL (Optional)</label>
                  <input
                    type="text"
                    value={tempProxyUrl}
                    onChange={(e) => setTempProxyUrl(e.target.value)}
                    placeholder="https://proxy.example.com/api/claude"
                    className="w-full rounded-xl bg-black/30 border border-vault-line/40 px-4 py-3 text-sm text-white focus:border-vault-cyan outline-none transition"
                  />
                  <p className="mt-1.5 text-[11px] text-slate-400 leading-relaxed">
                    A proxy that appends Anthropic API secret keys. Leave blank to run fully offline local forensic heuristics.
                  </p>
                </div>
              </div>

              <div className="mt-6 flex justify-end gap-3 border-t border-vault-line/30 pt-4">
                <button onClick={onClose} className="rounded-xl border border-vault-line/40 px-4 py-2 text-sm text-slate-300 hover:bg-white/5 transition">
                  Cancel
                </button>
                <button
                  onClick={() => {
                    onSave(tempClientId.trim() || "YOUR_GOOGLE_CLIENT_ID", tempProxyUrl.trim());
                    onClose();
                  }}
                  className="rounded-xl bg-vault-cyan hover:bg-vault-cyan/80 px-5 py-2 text-sm font-semibold text-slate-950 shadow-glow transition active:scale-95"
                >
                  Save Configuration
                </button>
              </div>
            </div>
          </div>
        );
      }

      function PrimaryTabs({ active, onTab }) {
        const tabs = [
          ["apps", "Connected Apps", "shield"],
          ["explorer", "File Explorer", "folder"],
          ["analytics", "Analytics", "chart"],
          ["appdata", "AppData Vault", "database"],
        ];
        return (
          <div className="flex flex-wrap gap-2 rounded-2xl border border-vault-line bg-vault-panel/85 p-1.5 shadow-glow backdrop-blur-md">
            {tabs.map(([id, label, icon]) => (
              <button
                key={id}
                onClick={() => onTab(id)}
                className={cx(
                  "min-h-[40px] flex items-center gap-2 rounded-xl px-4 py-2 text-sm font-medium transition-all duration-200 active:scale-95",
                  active === id 
                    ? "bg-vault-cyan text-slate-950 shadow-[0_0_15px_rgba(6,182,212,0.2)] font-semibold" 
                    : "text-slate-300 hover:bg-white/5 hover:text-white"
                )}
              >
                <Icon name={icon} className="w-4 h-4" />
                <span>{label}</span>
              </button>
            ))}
          </div>
        );
      }

      function ConnectedApps({ apps, tokenInfo, loading, listProgress, onViewFiles }) {
        return (
          <section className="space-y-6">
            <div className="rounded-2xl border border-vault-amber/30 bg-vault-amber/5 p-5 shadow-glow flex gap-4 items-start">
              <div className="rounded-xl bg-vault-amber/10 p-2 text-vault-amber">
                <Icon name="info" className="w-6 h-6 animate-pulse" />
              </div>
              <div>
                <h2 className="font-semibold text-amber-200 text-base">Google API Sandboxing Explained</h2>
                <p className="mt-1 text-sm text-slate-400 leading-relaxed">
                  DriveVault extracts files that connected third-party apps have saved in your public Drive directory and reads permissions activity. Under Google's security models, each application holds an isolated <code>appDataFolder</code>. No app can ever read another's isolated repository.
                </p>
              </div>
            </div>

            <div className="grid gap-4 sm:grid-cols-2 lg:grid-cols-4">
              <StatCard label="Apps / Sources" value={apps.length} icon="shield" color="cyan" />
              <StatCard label="OAuth Client ID" value={(tokenInfo?.aud || tokenInfo?.audience || "Unknown").slice(0, 16) + "..."} icon="key" color="violet" />
              <StatCard label="Token Expires" value={tokenInfo?.expires_in ? `${Math.round(Number(tokenInfo.expires_in) / 60)} min` : "Unknown"} icon="activity" color="teal" />
              <StatCard label="Indexed Files" value={apps.reduce((sum, app) => sum + app.files.length, 0)} icon="folder" color="green" />
            </div>

            {loading && (
              <div className="rounded-2xl border border-vault-line bg-vault-cyan/5 p-6 space-y-3 shadow-glow">
                <div className="flex justify-between items-center text-xs font-mono text-cyan-200">
                  <span className="flex items-center gap-2"><Icon name="activity" className="w-4 h-4 animate-spin text-vault-cyan" />Scanning Google Drive...</span>
                  <span>{listProgress} items found</span>
                </div>
                <div className="h-1.5 overflow-hidden rounded-full bg-black/40">
                  <div className="h-full w-2/3 animate-pulse rounded-full bg-vault-cyan"></div>
                </div>
              </div>
            )}

            {!loading && !apps.length && (
              <div className="rounded-2xl border border-dashed border-vault-line/60 p-12 text-center text-slate-400 glass-card">
                <Icon name="database" className="w-12 h-12 mx-auto text-slate-600 mb-3 animate-bounce" />
                No app-created clusters discovered. Your Drive folders are clean, or app activity details are not available.
              </div>
            )}

            <div className="grid gap-6 md:grid-cols-2">
              {apps.map((app) => (
                <article key={app.name} className="glass-card rounded-2xl p-5 shadow-glow relative overflow-hidden flex flex-col justify-between">
                  <div>
                    <div className="flex items-start justify-between gap-4">
                      <div className="min-w-0">
                        <div className="flex items-center gap-2">
                          <div className="rounded-lg bg-vault-cyan/10 p-1.5 text-vault-cyan">
                            <Icon name="shield" className="w-4 h-4" />
                          </div>
                          <h3 className="truncate text-lg font-bold text-white font-sans">{app.name}</h3>

                        ? "border-vault-cyan bg-vault-cyan/5 shadow-[0_0_15px_rgba(6,182,212,0.08)]" 
                        : "border-vault-line/10 bg-black/15 hover:border-vault-cyan/35 hover:bg-black/25"
                    )}
                  >
                    <input 
                      type="checkbox" 
                      checked={selectedIds.has(file.id)} 
                      onChange={() => onToggle(file.id)} 
                      className="mt-1 rounded border-vault-line/50 cursor-pointer" 
                    />
                    <button onClick={() => onSelect(file.id)} className="min-w-0 flex-1 text-left">
                      <div className="flex items-start gap-2">
                        <span className={cx("rounded px-1.5 py-0.5 font-mono text-[9px] border", icon.color)}>{icon.label}</span>
                        <div className="min-w-0 flex-1">
                          <div className="truncate font-semibold text-white text-xs">{file.name}</div>
                          <div className="mt-1 truncate font-mono text-[10px] text-slate-500 leading-none">{file.mimeType || "unknown"} · {formatBytes(file.size)}</div>
                        </div>
                      </div>
                      <div className="mt-2.5 font-mono text-[9px] text-slate-500 border-t border-vault-line/5 pt-1.5">
                        Modified {formatDate(file.modifiedTime)}
                      </div>
                    </button>
                  </div>
                );
              })}
            </div>
          </div>
        );
      }

      function Inspector({ state, selectedFile, proxyUrl, onTab, onContent, onNotice }) {
        if (state.activeTab === "analytics") {
          return <Analytics files={state.files} groups={state.groups} changes={state.changes} />;
        }
        
        if (!selectedFile) {
          return (
            <div className="glass-panel rounded-2xl p-10 text-center shadow-glow flex flex-col justify-center items-center h-full min-h-[300px]">
              <Icon name="file" className="w-12 h-12 text-slate-700 animate-pulse mb-3" />
              <h2 className="text-base font-bold text-white uppercase tracking-wider">Audit Target Undefined</h2>
              <p className="mt-1.5 text-xs text-slate-400 max-w-xs leading-relaxed">Choose an extracted file element from the registry list to audit metadata properties, contents, and run heuristics.</p>
            </div>
          );
        }

        const tabs = ["metadata", "content", "analysis", "changes"];
        return (
          <div className="glass-panel rounded-2xl shadow-glow overflow-hidden flex flex-col">
            <div className="flex flex-wrap gap-1.5 border-b border-vault-line/10 bg-black/15 p-3">
              {tabs.map((tab) => (
                <button
                  key={tab}
                  onClick={() => onTab(tab)}
                  className={cx(
                    "rounded-lg px-3.5 py-2 text-xs font-semibold capitalize transition-all duration-200 active:scale-95",
                    state.activeTab === tab 
                      ? "bg-vault-cyan text-slate-950 shadow-[0_0_10px_rgba(6,182,212,0.15)]" 
                      : "border border-vault-line/30 text-slate-300 hover:border-vault-cyan/50 hover:bg-white/5"
                  )}
                >
                  {tab === "changes" ? "Audit Log" : tab}
                  {tab === "changes" && state.changedCount ? ` (${state.changedCount})` : ""}
                </button>
              ))}
            </div>
            <div className="p-4 space-y-4">
              {state.activeTab === "metadata" && <MetadataTab file={selectedFile} onNotice={onNotice} />}
              {state.activeTab === "content" && <ContentTab token={state.token} file={selectedFile} cached={state.contentCache[selectedFile.id]} onContent={onContent} onNotice={onNotice} />}
              {state.activeTab === "analysis" && <AnalysisTab token={state.token} file={selectedFile} cached={state.contentCache[selectedFile.id]} onContent={onContent} privacyMode={state.privacyMode} proxyUrl={proxyUrl} />}
              {state.activeTab === "changes" && <ChangesTab changes={state.changes} />}
            </div>
          </div>
        );
      }

      function MetadataTab({ file, onNotice }) {
        const rows = [
          ["File ID", file.id],
          ["Name", file.name],
          ["MIME Type", file.mimeType || "unknown"],
          ["Size", formatBytes(file.size)],
          ["Created Date", formatDate(file.createdTime)],
          ["Modified Date", formatDate(file.modifiedTime)],
          ["MD5 Checksum", file.md5Checksum || "Unavailable"],
        ];
        return (
          <div className="space-y-5">
            <div className="grid gap-3 sm:grid-cols-2">
              {rows.map(([label, value]) => (
                <div key={label} className="rounded-xl border border-vault-line/10 bg-black/20 p-3.5 relative overflow-hidden group">
                  <div className="font-mono text-[9px] uppercase tracking-wider text-slate-500">{label}</div>
                  <div className="mt-1 break-all text-xs text-slate-200 font-semibold">{value}</div>
                </div>
              ))}
            </div>
            <div className="flex gap-2">
              <button
                onClick={async () => {
                  await navigator.clipboard.writeText(file.id);
                  onNotice("File ID copied to clipboard.");
                }}
                className="rounded-xl border border-vault-cyan/30 bg-vault-cyan/5 hover:bg-vault-cyan/15 px-4 py-2 text-xs font-semibold text-vault-cyan transition active:scale-95 flex items-center gap-1.5"
              >
                <Icon name="copy" className="w-3.5 h-3.5" />
                Copy File ID
              </button>
            </div>
            <KeyValue title="Application-Defined Properties" data={file.appProperties} />
            <KeyValue title="User Security Capabilities" data={file.capabilities} />
            
            <div className="space-y-1.5">
              <div className="font-mono text-[10px] uppercase tracking-wider text-slate-400">Raw JSON Metadata</div>
              <CodeBlock language="json" value={JSON.stringify(file, null, 2)} height="300px" />
            </div>
          </div>
        );
      }

      function KeyValue({ title, data }) {
        const entries = Object.entries(data || {});
        return (
          <div className="rounded-xl border border-vault-line/10 bg-black/20 p-4">
            <h3 className="mb-3 font-bold text-white text-xs uppercase tracking-wider font-sans">{title}</h3>
            {!entries.length ? (
              <p className="text-xs text-slate-500 font-mono">No keys declared in metadata headers.</p>
            ) : (
              <div className="grid gap-2 sm:grid-cols-2">
                {entries.map(([key, value]) => (
                  <div key={key} className="rounded-lg bg-slate-900 border border-vault-line/5 p-2.5">
                    <div className="font-mono text-[10px] text-vault-green">{key}</div>
                    <div className="mt-1 break-all text-xs text-slate-300 font-semibold">{String(value)}</div>
                  </div>
                ))}
              </div>
            )}
          </div>
        );
      }

      function ContentTab({ token, file, cached, onContent, onNotice }) {
        const [loading, setLoading] = useState(false);
        const [error, setError] = useState("");

        useEffect(() => {
          setError("");
        }, [file.id]);

        async function loadContent(force = false) {
          if (cached && !force) return;
          if (Number(file.size || 0) > 10 * 1024 * 1024 && !confirm(`${file.name} is larger than 10MB. Download content for preview anyway?`)) return;
          setLoading(true);
          setError("");
          try {
            const blob = await downloadBlob(token, file.id);
            const arrayBuffer = await blob.arrayBuffer();
            const isText = isTextFile(file);
            const text = isText ? await blob.text() : "";
            const content = {
              blob,
              arrayBuffer,
              url: URL.createObjectURL(blob),
              text,
              signals: isText ? scanContent(text) : [],
            };
            onContent(file.id, content);
          } catch (error) {
            setError(error.message);
          } finally {
            setLoading(false);
          }
        }

        async function saveFile() {
          const activeBlob = cached?.blob || await downloadBlob(token, file.id);
          const a = document.createElement("a");
          a.href = URL.createObjectURL(activeBlob);
          a.download = safeName(file.name);
          a.click();
          onNotice("File download started.");
        }

        return (
          <div className="space-y-4">
            <div className="flex flex-wrap items-center gap-3">
              <button 
                onClick={() => loadContent()} 
                disabled={loading} 
                className="rounded-xl bg-vault-green hover:bg-vault-green/80 px-4 py-2.5 text-xs font-bold text-slate-950 disabled:opacity-50 transition active:scale-95 flex items-center gap-1"
              >
                <Icon name="refresh" className="w-3.5 h-3.5" />
                {cached ? "Reload Payload" : loading ? "Loading..." : "Load Payload"}
              </button>
              <button onClick={saveFile} className="rounded-xl border border-vault-line/60 bg-black/20 hover:bg-white/5 px-4 py-2 text-xs font-semibold text-slate-200 transition active:scale-95 flex items-center gap-1">
                <Icon name="download" className="w-3.5 h-3.5" />
                Download Content
              </button>
              {Number(file.size || 0) > 10 * 1024 * 1024 && (
                <span className="rounded-full border border-vault-amber/30 bg-vault-amber/10 px-3 py-1 font-mono text-[9px] text-vault-amber font-semibold">Large size payload warning</span>
              )}
            </div>
            {error && <div className="rounded-xl border border-vault-red/30 bg-vault-red/10 p-4 text-xs text-red-200">{error}</div>}
            {!cached && !loading && (
              <div className="rounded-xl border border-dashed border-vault-line/40 p-10 text-center text-xs text-slate-500 font-mono">
                Payload not requested. Click "Load Payload" to fetch.
              </div>
            )}
            {cached && <SmartPreview file={file} content={cached} />}
          </div>
        );
      }

      function isTextFile(file) {
        const mime = (file.mimeType || "").toLowerCase();
        return mime.includes("json") || mime.startsWith("text/") || /\.(json|txt|md|csv|xml|yaml|yml|log|ini|cfg)$/i.test(file.name || "");
      }

      function SmartPreview({ file, content }) {
        const mime = file.mimeType || "";
        if (mime.startsWith("image/")) {
          return (
            <div className="rounded-xl border border-vault-line/10 bg-black/30 p-3 flex justify-center">
              <img src={content.url} alt={file.name} className="max-h-[500px] max-w-full rounded-lg object-contain shadow-glow" />
            </div>
          );
        }
        if (isTextFile(file)) {
          const language = mime.includes("json") || /\.json$/i.test(file.name) ? "json" : "plaintext";
          return (
            <div className="space-y-4">
              {content.signals?.length > 0 && <SensitiveBanner signals={content.signals} />}
              <CodeBlock language={language} value={content.text || ""} height="500px" />
            </div>
          );
        }
        return <HexViewer buffer={content.arrayBuffer} />;
      }

      function SensitiveBanner({ signals }) {
        return (
          <div className="rounded-xl border border-vault-red/30 bg-vault-red/5 p-4 flex gap-3 items-start shadow-redGlow">
            <div className="rounded-lg bg-vault-red/10 p-1.5 text-vault-red">
              <Icon name="shield" className="w-5 h-5 animate-pulse" />
            </div>
            <div>
              <div className="font-bold text-red-200 text-xs uppercase tracking-wider">Heuristics: Privacy Vulnerability</div>
              <p className="mt-1 text-xs text-slate-400 leading-normal">
                Extracted content elements match sensitive forensic keys: <span className="text-red-300 font-mono font-semibold">{Array.from(new Set(signals)).join(", ")}</span>. These vectors should be verified.
              </p>
            </div>
          </div>
        );
      }

      function CodeBlock({ language, value, height }) {
        const ref = useRef(null);
        const editorRef = useRef(null);
        useEffect(() => {
          let disposed = false;
          window.require.config({ paths: { vs: "https://cdn.jsdelivr.net/npm/monaco-editor@0.49.0/min/vs" } });
          window.require(["vs/editor/editor.main"], () => {
            if (disposed || !ref.current) return;
            if (editorRef.current) editorRef.current.dispose();
            editorRef.current = monaco.editor.create(ref.current, {
              value,
              language,
              readOnly: true,
              minimap: { enabled: false },
              theme: "vs-dark",
              automaticLayout: true,
              wordWrap: "on",
              fontFamily: "JetBrains Mono",
              fontSize: 12,
              scrollBeyondLastLine: false,
            });
          });
          return () => {
            disposed = true;
            editorRef.current?.dispose();
          };
        }, [language, value]);
        return <div ref={ref} style={{ height }} className="overflow-hidden rounded-xl border border-vault-line/30" />;
      }

      function HexViewer({ buffer }) {
        const bytes = new Uint8Array(buffer || new ArrayBuffer(0));
        const lines = [];
        for (let offset = 0; offset < Math.min(bytes.length, 1024 * 1024); offset += 16) {
          const slice = bytes.slice(offset, offset + 16);
          const hex = Array.from(slice).map((byte) => byte.toString(16).padStart(2, "0")).join(" ");
          const ascii = Array.from(slice).map((byte) => (byte >= 32 && byte <= 126 ? String.fromCharCode(byte) : ".")).join("");
          lines.push({ offset, hex, ascii });
        }
        return (
          <div className="max-h-[500px] overflow-auto rounded-xl border border-vault-line/20 bg-black/40 p-4 font-mono text-xs scrollbar-thin">
            <div className="mb-3 text-[10px] text-slate-500 uppercase tracking-widest">Hex dump preview ({formatBytes(Math.min(bytes.length, 1024 * 1024))})</div>
            <div className="space-y-1">
              {lines.map((line) => (
                <div key={line.offset} className="grid grid-cols-[80px_1fr_140px] gap-4 py-0.5 hover:bg-white/5 rounded px-1 transition duration-100">
                  <span className="text-vault-cyan/80">{line.offset.toString(16).padStart(8, "0")}</span>
                  <span className="text-slate-300 select-all">{line.hex}</span>
                  <span className="text-vault-green select-none border-l border-vault-line/10 pl-3">{line.ascii}</span>
                </div>
              ))}
            </div>
          </div>
        );
      }

      function AnalysisTab({ token, file, cached, onContent, privacyMode, proxyUrl }) {
        const [output, setOutput] = useState("");
        const [loading, setLoading] = useState(false);
        const [error, setError] = useState("");
        const signals = cached?.text ? scanContent(cached.text) : scanMetadata(file);

        async function ensureText() {
          if (cached?.text) return cached.text;
          if (!isTextFile(file)) throw new Error("Analysis is available for JSON and text files.");
          if (Number(file.size || 0) > 10 * 1024 * 1024 && !confirm(`${file.name} is larger than 10MB. Download for analysis anyway?`)) return "";
          const blob = await downloadBlob(token, file.id);
          const text = await blob.text();
          onContent(file.id, { blob, arrayBuffer: await blob.arrayBuffer(), url: URL.createObjectURL(blob), text, signals: scanContent(text) });
          return text;
        }

        async function analyze() {
          setLoading(true);
          setError("");
          setOutput("");
          try {
            const text = await ensureText();
            if (!text) return;
            
            if (privacyMode) {
              setOutput(localHeuristicAnalysis(file, text));
              setError("Privacy Mode is active. Claude connections are bypassed. Running local diagnostics heuristics.");
              return;
            }
            
            if (!proxyUrl) {
              setOutput(localHeuristicAnalysis(file, text));
              setError("Claude proxy URL is not configured. Running local diagnostics heuristics.");
              return;
            }

            const prompt = `Analyze this Google Drive file that appears associated with an app. Explain what app likely wrote it, what user data it contains, what purpose it serves, and any privacy concerns. Be concise and specific.\n\nFilename: ${file.name}\nMIME type: ${file.mimeType || "unknown"}\nMetadata:\n${JSON.stringify(file, null, 2)}\n\nContent excerpt:\n${text.slice(0, 8000)}`;
            const res = await fetch(proxyUrl, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                model: "claude-sonnet-4-20250514",
                stream: true,
                system: "You are a privacy and data forensics expert. Analyze this file from a user's Google Drive that was created by or associated with a third-party app. Explain what app likely wrote it, what user data it contains, what purpose it serves, and any privacy concerns.",
                prompt,
              }),
            });
            if (!res.ok || !res.body) throw new Error(await res.text());
            const reader = res.body.getReader();
            const decoder = new TextDecoder();
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              setOutput((current) => current + decoder.decode(value, { stream: true }));
            }
          } catch (error) {
            setError(error.message);
          } finally {
            setLoading(false);
          }
        }

        return (
          <div className="space-y-4">
            <div className="flex flex-wrap items-center gap-3">
              <button 
                onClick={analyze} 
                disabled={loading} 
                className="rounded-xl bg-vault-cyan hover:bg-vault-cyan/80 px-4 py-2.5 text-xs font-bold text-slate-950 disabled:opacity-50 transition active:scale-95 flex items-center gap-1.5 shadow-glow"
              >
                <Icon name="activity" className="w-3.5 h-3.5" />
                {loading ? "Forensics Scanning..." : "Run AI Analysis"}
              </button>
              <span className="rounded-full border border-vault-line/20 bg-slate-800/40 px-3 py-1 font-mono text-[9px] text-slate-400">Claude-Powered Analysis</span>
              {signals.length > 0 && (
                <span className="rounded-full border border-vault-red/30 bg-vault-red/10 px-3 py-1 font-mono text-[9px] text-red-300 font-semibold animate-pulse">Flags Raised</span>
              )}
            </div>
            
            {error && (
              <div className="rounded-xl border border-vault-amber/30 bg-vault-amber/5 p-4 text-xs text-amber-200">
                {error}
              </div>
            )}
            
            <div className="min-h-[360px] whitespace-pre-wrap rounded-xl border border-vault-line/20 bg-black/40 p-4 font-mono text-xs leading-relaxed text-slate-200">
              {output || "Trigger analytical execution to generate data forensics overview..."}
            </div>
          </div>
        );
      }

      function localHeuristicAnalysis(file, text) {
        let parsed = null;
        try { parsed = JSON.parse(text); } catch {}
        const signals = scanContent(text);
        const keys = parsed && typeof parsed === "object" ? collectKeys(parsed).slice(0, 40) : [];
        return [
          `==== DriveVault Forensics Terminal ====`,
          `Analyzed object: ${file.name}`,
          `=========================================`,
          `Likely origin: ${inferAppName(file)}`,
          `Payload MIME type: ${file.mimeType || "unknown"}`,
          `Size: ${formatBytes(file.size)}`,
          `-----------------------------------------`,
          keys.length ? `Index mapping keys discovered:\n  ${keys.join("\n  ")}` : `No parseable structural keys found.`,
          `-----------------------------------------`,
          signals.length ? `Sensitive vulnerability triggers found:\n  ${signals.join("\n  ")}` : `No plain-text vulnerability flags raised.`,
          `-----------------------------------------`,
          `Forensic scan ended successfully.`
        ].join("\n");
      }

      function collectKeys(value, prefix = "", keys = []) {
        if (!value || typeof value !== "object" || keys.length > 120) return keys;
        Object.entries(value).forEach(([key, child]) => {
          const path = prefix ? `${prefix}.${key}` : key;
          keys.push(path);
          if (child && typeof child === "object") collectKeys(child, path, keys);
        });
        return keys;
      }

      function Analytics({ files, groups, changes }) {
        const total = files.reduce((sum, file) => sum + Number(file.size || 0), 0);
        const mimeMap = files.reduce((acc, file) => {
          const mime = file.mimeType || "unknown";
          acc[mime] = (acc[mime] || 0) + 1;
          return acc;
        }, {});
        const largest = [...files].sort((a, b) => Number(b.size || 0) - Number(a.size || 0)).slice(0, 10);
        
        return (
          <div className="space-y-6">
            <div className="grid gap-4 sm:grid-cols-2 lg:grid-cols-4">
              <StatCard label="Total Audit Volume" value={formatBytes(total)} icon="database" color="cyan" />
              <StatCard label="Audited Objects" value={files.length} icon="file" color="green" />
              <StatCard label="App Nodes Discovered" value={groups.length} icon="shield" color="violet" />
              <StatCard label="Alert Level Nodes" value={groups.filter((group) => group.risk !== "Low").length} icon="activity" color="teal" />
            </div>

            <div className="grid gap-6 lg:grid-cols-2">
              <ChartCard type="doughnut" title="Storage Allocation by App" labels={groups.map((g) => g.name)} data={groups.map((g) => g.size)} />
              <ChartCard type="bar" title="Payload Count per App" labels={groups.map((g) => g.name)} data={groups.map((g) => g.files.length)} />
            </div>

            <div className="grid gap-6 lg:grid-cols-2">
              <div className="rounded-2xl border border-vault-line/15 bg-black/20 p-4">
                <h3 className="mb-3 font-bold text-white text-xs uppercase tracking-wider font-sans border-b border-vault-line/10 pb-2.5">File Types Catalog</h3>
                <div className="space-y-2 max-h-[300px] overflow-auto pr-1 scrollbar-thin">
                  {Object.entries(mimeMap).map(([mime, count]) => (
                    <div key={mime} className="flex justify-between gap-4 rounded-xl bg-slate-900 border border-vault-line/5 p-3 text-xs">
                      <span className="truncate font-mono text-slate-400">{mime}</span>
                      <span className="text-vault-green font-bold font-mono">{count}</span>
                    </div>
                  ))}
                </div>
              </div>
              <div className="rounded-2xl border border-vault-line/15 bg-black/20 p-4">
                <h3 className="mb-3 font-bold text-white text-xs uppercase tracking-wider font-sans border-b border-vault-line/10 pb-2.5">Largest Payload Audit</h3>
                <div className="space-y-2 max-h-[300px] overflow-auto pr-1 scrollbar-thin">
                  {largest.map((file) => (
                    <div key={file.id} className="flex justify-between gap-4 rounded-xl bg-slate-900 border border-vault-line/5 p-3 text-xs">
                      <span className="truncate text-slate-300 font-medium">{file.name}</span>
                      <span className="font-mono text-vault-cyan font-bold shrink-0">{formatBytes(file.size)}</span>
                    </div>
                  ))}
                </div>
              </div>
            </div>
            
            <div className="rounded-2xl border border-vault-line/15 bg-black/20 p-4">
              <h3 className="mb-3 font-bold text-white text-xs uppercase tracking-wider font-sans border-b border-vault-line/10 pb-2.5">File Updates Heatmap</h3>
              <Timeline files={files} changes={changes} />
            </div>
          </div>
        );
      }

      function ChartCard({ type, title, labels, data }) {
        const ref = useRef(null);
        useEffect(() => {
          if (!ref.current) return;
          const chart = new Chart(ref.current, {
            type,
            data: {
              labels,
              datasets: [{
                data,
                backgroundColor: [
                  "#06b6d4", // cyan
                  "#10b981", // emerald
                  "#f59e0b", // amber
                  "#f43f5e", // rose
                  "#8b5cf6", // violet
                  "#14b8a6", // teal
                  "#3b82f6", // blue
                ],
                borderColor: "#0a0f18",
                borderWidth: 2,
              }],
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: { 
                legend: { 
                  position: "right",
                  labels: { 
                    color: "#cbd5e1",
                    font: { family: "Space Grotesk", size: 10 }
                  } 
                } 
              },
              scales: type === "bar" ? { 
                x: { grid: { color: "rgba(255,255,255,0.03)" }, ticks: { color: "#94a3b8", font: { family: "Space Grotesk" } } }, 
                y: { grid: { color: "rgba(255,255,255,0.03)" }, ticks: { color: "#94a3b8", font: { family: "Space Grotesk" } } } 
              } : undefined,
            },
          });
          return () => chart.destroy();
        }, [type, JSON.stringify(labels), JSON.stringify(data)]);
        return (
          <div className="rounded-2xl border border-vault-line/15 bg-black/20 p-4 flex flex-col">
            <h3 className="mb-3 font-bold text-white text-xs uppercase tracking-wider font-sans border-b border-vault-line/10 pb-2.5">{title}</h3>
            <div className="h-60 relative w-full">
              <canvas ref={ref}></canvas>
            </div>
          </div>
        );
      }

      function Timeline({ files }) {
        const buckets = files.reduce((acc, file) => {
          const day = file.modifiedTime ? file.modifiedTime.slice(0, 10) : "unknown";
          acc[day] = (acc[day] || 0) + 1;
          return acc;
        }, {});
        return (
          <div className="space-y-2.5 max-h-[300px] overflow-auto pr-1 scrollbar-thin">
            {Object.entries(buckets).sort().slice(-20).map(([day, count]) => (
              <div key={day} className="grid grid-cols-[120px_1fr_40px] items-center gap-4 font-mono text-xs">
                <span className="text-slate-400 font-medium">{day}</span>
                <div className="h-2 rounded-full bg-slate-900 border border-vault-line/5 overflow-hidden">
                  <div className="h-full bg-vault-green rounded-full shadow-greenGlow" style={{ width: `${Math.min(100, count * 10)}%` }}></div>
                </div>
                <span className="text-vault-green font-bold text-right">{count}</span>
              </div>
            ))}
          </div>
        );
      }

      function ChangesTab({ changes }) {
        return (
          <div className="space-y-3 max-h-[400px] overflow-auto pr-1 scrollbar-thin">
            {!changes.length && (
              <div className="rounded-xl border border-dashed border-vault-line/40 p-8 text-center text-xs text-slate-500 font-mono">
                Diagnostics monitoring active. Polling frequency: 30s. No events captured.
              </div>
            )}
            {changes.map((change, index) => (
              <div key={`${change.file.id}-${index}`} className="rounded-xl border border-vault-line/10 bg-black/20 p-4 space-y-3 relative overflow-hidden">
                <div className="flex justify-between items-start gap-4">
                  <div className="min-w-0">
                    <span className={cx(
                      "rounded px-2.5 py-0.5 font-mono text-[9px] font-bold border", 
                      change.type === "created" 
                        ? "bg-vault-green/10 text-vault-green border-vault-green/20" 
                        : "bg-vault-amber/10 text-vault-amber border-vault-amber/20"
                    )}>
                      {change.type.toUpperCase()}
                    </span>
                    <h3 className="mt-2.5 font-bold text-white text-xs truncate">{change.file.name}</h3>
                    <p className="mt-1 font-mono text-[10px] text-slate-500 truncate">{change.file.id}</p>
                  </div>
                  <div className="text-right text-[10px] text-slate-400 font-mono shrink-0">{formatDate(change.at)}</div>
                </div>
              </div>
            ))}
          </div>
        );
      }

      function RiskBadge({ risk }) {
        const styles = {
          Low: "border-vault-green/20 bg-vault-green/10 text-vault-green",
          Medium: "border-vault-amber/20 bg-vault-amber/10 text-vault-amber",
          High: "border-vault-red/20 bg-vault-red/10 text-vault-red shadow-redGlow animate-pulse",
        };
        return <span className={cx("rounded-full border px-2.5 py-0.5 font-mono text-[9px] font-bold shrink-0", styles[risk])}>{risk}</span>;
      }

      function Logo({ size }) {
        const large = size === "large";
        return (
          <div className={cx("grid place-items-center rounded-2xl border border-vault-cyan/30 bg-vault-cyan/5 shadow-glow", large ? "h-16 w-16" : "h-10 w-10")}>
            <svg viewBox="0 0 64 64" className={large ? "h-10 w-10 animate-pulse" : "h-6 w-6"} fill="none">
              <path d="M18 28v-7c0-7.7 6.3-14 14-14s14 6.3 14 14v7" stroke="#10b981" strokeWidth="4.5" strokeLinecap="round" />
              <rect x="12" y="26" width="40" height="30" rx="6" stroke="#06b6d4" strokeWidth="4.5" fill="#0b131f" />
              <path d="M32 38v8" stroke="#fff" strokeWidth="4.5" strokeLinecap="round" />
              <circle cx="32" cy="36" r="3.5" fill="#fff" />
            </svg>
          </div>
        );
      }

      function Toast({ tone, message, onClose }) {
        return (
          <div className={cx(
            "fixed right-4 top-20 z-50 max-w-md rounded-xl border p-4 shadow-glow flex items-start justify-between gap-4 animate-fade-in", 
            tone === "error" 
              ? "border-vault-red/30 bg-vault-red/10 text-red-200" 
              : "border-vault-cyan/30 bg-vault-cyan/10 text-cyan-200"
          )}>
            <div className="flex gap-2.5 items-start">
              <div className="mt-0.5">
                <Icon name={tone === "error" ? "shield" : "info"} className="w-4 h-4" />
              </div>
              <p className="text-xs font-medium leading-relaxed">{message}</p>
            </div>
            <button onClick={onClose} className="text-slate-400 hover:text-white shrink-0">
              <Icon name="close" className="w-4 h-4" />
            </button>
          </div>
        );
      }

      function downloadText(filename, text, type = "text/plain") {
        const blob = new Blob([text], { type });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = filename;
        a.click();
      }

      function exportCsv(files) {
        const header = ["id", "name", "size", "modifiedTime", "mimeType"];
        const rows = files.map((file) => header.map((key) => JSON.stringify(file[key] || "")).join(","));
        downloadText("drivevault-metadata.csv", [header.join(","), ...rows].join("\n"), "text/csv");
      }

      async function bulkZip(state, dispatch) {
        const targets = state.selectedIds.size ? state.files.filter((file) => state.selectedIds.has(file.id)) : state.files;
        if (!targets.length) return;
        const zip = new JSZip();
        const limiter = createLimiter(5);
        dispatch({ type: "PROGRESS", progress: { label: "Downloading payload packages", done: 0, total: targets.length } });
        let done = 0;
        await Promise.all(targets.map((file) => limiter(async () => {
          const blob = await downloadBlob(state.token, file.id);
          zip.file(safeName(file.name), blob);
          zip.file(`${safeName(file.name)}.metadata.json`, JSON.stringify(file, null, 2));
          done += 1;
          dispatch({ type: "PROGRESS", progress: { label: "Downloading payload packages", done, total: targets.length } });
        })));
        zip.file("metadata.json", JSON.stringify(targets, null, 2));
        dispatch({ type: "PROGRESS", progress: { label: "Assembling zip archive", done: targets.length, total: targets.length } });
        const blob = await zip.generateAsync({ type: "blob" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "drivevault-export.zip";
        a.click();
        dispatch({ type: "PROGRESS", progress: null });
      }

      async function exportReport(state, dispatch) {
        const targets = state.selectedIds.size ? state.files.filter((file) => state.selectedIds.has(file.id)) : state.files;
        const limiter = createLimiter(5);
        let done = 0;
        const report = [];
        dispatch({ type: "PROGRESS", progress: { label: "Compiling JSON report", done, total: targets.length } });
        await Promise.all(targets.map((file) => limiter(async () => {
          const entry = { metadata: file, textBase64: null };
          if (isTextFile(file) && Number(file.size || 0) < 2 * 1024 * 1024) {
            const blob = await downloadBlob(state.token, file.id);
            entry.textBase64 = await blobToBase64(blob);
          }
          report.push(entry);
          done += 1;
          dispatch({ type: "PROGRESS", progress: { label: "Compiling JSON report", done, total: targets.length } });
        })));
        downloadText("drivevault-full-report.json", JSON.stringify({ exportedAt: new Date().toISOString(), files: report }, null, 2), "application/json");
        dispatch({ type: "PROGRESS", progress: null });
      }

      async function bulkDelete(state, dispatch, refreshFiles) {
        const targets = state.files.filter((file) => state.selectedIds.has(file.id) && file.source === "appDataFolder");
        if (!targets.length) return;
        if (!confirm(`Delete ${targets.length} DriveVault appDataFolder files? This cannot be undone.`)) return;
        if (prompt(`Type DELETE ${targets.length} to confirm`) !== `DELETE ${targets.length}`) return;
        const limiter = createLimiter(5);
        let done = 0;
        dispatch({ type: "PROGRESS", progress: { label: "Purging files", done, total: targets.length } });
        await Promise.all(targets.map((file) => limiter(async () => {
          await deleteDriveFile(state.token, file.id);
          done += 1;
          dispatch({ type: "PROGRESS", progress: { label: "Purging files", done, total: targets.length } });
        })));
        dispatch({ type: "PROGRESS", progress: null });
        await refreshFiles();
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
